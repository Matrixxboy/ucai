services:
  - type: web
    name: ucai-server
    env: python
    buildCommand: cd Server && pip install -r requirements.txt
    startCommand: cd Server && uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.0
      - key: UCAI_BASE_DIR
        value: /var/data
    disk:
      name: ucai-data
      mountPath: /var/data
      sizeGB: 10
